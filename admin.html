<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="keywords" content="兆尹云台 低代码平台 后台" />
    <meta name="description" content="兆尹云台 低代码平台 后台" />
    <title>%VITE_APP_TITLE%</title>
</head>
<body>
<div id="app">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .app-loading {
            display: flex;
            width: 100%;
            height: 100vh;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            background: #f5f8ff;
        }

        .app-loading .app-loading-wrap {
            position: absolute;
            top: 50%;
            left: 50%;
            display: flex;
            -webkit-transform: translate3d(-50%, -50%, 0);
            transform: translate3d(-50%, -50%, 0);
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .app-loading .app-loading-title {
            margin-bottom: 5Px;
            font-size: 28Px;
            font-weight: bold;
            text-align: center;
        }

        .app-loading .app-loading-item {
            position: relative;
            display: inline-block;    
            width: 150Px;
            height: 180Px;
            vertical-align: middle;
            border-radius: 50%;
        }
        .app-loading .app-loading-item svg {
            position: relative;
            width: 150Px;
            height: 150Px;
            animation: rotate 2s linear infinite;
        }
        .app-loading .app-loading-item svg circle {
            width: 100%;
            height: 100%;
            fill: none;
            stroke-width: 10;
            stroke: #00a1ff;
            stroke-linecap: round;
            transform: translate(5Px, 5Px);
            stroke-dasharray: 440;
            stroke-dashoffset: 440;
            animation: animate 4s linear infinite;
        }


        @keyframes animate {
            0%,
            100% {
                stroke-dashoffset: 440;
            }
            50% {
                stroke-dashoffset: 0;
            }
            50.1% {
                stroke-dashoffset: 880;
            }
        }
        @keyframes rotate {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
    <div class="app-loading">
        <div class="app-loading-wrap">
            <div class="app-loading-item">
                <svg>
                    <circle cx="70" cy="70" r="70"></circle>
                </svg>
            </div>
            <div class="app-loading-title">
                <!--            <img src="/logo.gif" class="app-loading-logo" alt="Logo" />-->
                <div class="app-loading-title">%VITE_APP_TITLE%-后台</div>
            </div>
        </div>
    </div>
</div>
<script type="module" src="/src/web-admin/main.ts"></script>
</body>
</html>
